
name: Build RQ General Services APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          ZIP="RQ_General_Services_Professional_Final_Tiny_Social_2026-11-11.zip"
          test -f "$ZIP"
          mkdir -p app/src/main/assets/site
          unzip -q "$ZIP" -d app/src/main/assets/site
          test -f app/src/main/assets/site/index.html

          mkdir -p app/src/main/java/com/rq/generalservices
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RQGeneralServices"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.rq.generalservices'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.rq.generalservices'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:theme="@style/AppTheme"
                  android:label="@string/app_name"
                  android:usesCleartextTraffic="false"
                  android:allowBackup="true"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/rq/generalservices/MainActivity.java <<'EOF'
          package com.rq.generalservices;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.content.Intent;
          import android.net.Uri;

          public class MainActivity extends Activity {
              WebView webView;

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);
                  webView = new WebView(this);
                  setContentView(webView);

                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.getSettings().setAllowFileAccess(true);
                  webView.setWebChromeClient(new WebChromeClient());

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(
                          WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          String scheme = uri.getScheme() == null
                              ? "" : uri.getScheme();

                          if (scheme.equals("http") ||
                              scheme.equals("https")) {
                              String host = uri.getHost() == null
                                  ? "" : uri.getHost();

                              if (host.equals("rqgenralservess.netlify.app"))
                                  return false;

                              try {
                                  startActivity(new Intent(
                                      Intent.ACTION_VIEW, uri));
                              } catch (Exception ignored) {}
                              return true;
                          }

                          if (scheme.equals("tel") ||
                              scheme.equals("mailto") ||
                              scheme.equals("whatsapp")) {
                              try {
                                  startActivity(new Intent(
                                      Intent.ACTION_VIEW, uri));
                              } catch (Exception ignored) {}
                              return true;
                          }
                          return false;
                      }
                  });

                  webView.loadUrl(
                      "file:///android_asset/site/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack())
                      webView.goBack();
                  else
                      super.onBackPressed();
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) webView.destroy();
                  super.onDestroy();
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">RQ General Services</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#D7A94B</item>
                  <item name="android:statusBarColor">#102C46</item>
                  <item name="android:navigationBarColor">#102C46</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RQ-General-Services-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
